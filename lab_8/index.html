<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Social Network</title>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
      <h1 class="text-3xl font-bold mb-4 text-center text-blue-700">
        Social Network Users
      </h1>
      <form id="filterForm" class="flex flex-wrap gap-4 mb-6 justify-center">
        <input
          type="text"
          id="name"
          placeholder="Name"
          class="border rounded px-2 py-1"
        />
        <input
          type="text"
          id="city"
          placeholder="City"
          class="border rounded px-2 py-1"
        />
        <input
          type="number"
          id="age"
          placeholder="Age"
          class="border rounded px-2 py-1 w-24"
          min="0"
        />
        <input
          type="text"
          id="interest"
          placeholder="Interest"
          class="border rounded px-2 py-1"
        />
        <button
          type="submit"
          class="bg-blue-500 text-white px-4 py-1 rounded hover:bg-blue-600"
        >
          Filter
        </button>
        <button
          type="button"
          id="resetBtn"
          class="bg-blue-300 text-white px-4 py-1 rounded hover:bg-blue-500"
        >
          Reset
        </button>
      </form>
      <button
        id="addUserBtn"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700 mb-6 block mx-auto"
      >
        Add User
      </button>
      <div
        id="usersContainer"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
      ></div>

      <div
        id="userModal"
        class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden"
      >
        <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md">
          <h2 id="modalTitle" class="text-xl font-bold mb-4">Add User</h2>
          <form id="userForm" class="flex flex-col gap-3">
            <input
              type="text"
              id="modalName"
              placeholder="Name"
              class="border rounded px-2 py-1"
              required
            />
            <input
              type="text"
              id="modalCity"
              placeholder="City"
              class="border rounded px-2 py-1"
              required
            />
            <input
              type="number"
              id="modalAge"
              placeholder="Age"
              class="border rounded px-2 py-1"
              min="0"
              required
            />
            <input
              type="text"
              id="modalInterest"
              placeholder="Interest"
              class="border rounded px-2 py-1"
              required
            />
            <input
              type="text"
              id="modalHeadline"
              placeholder="Headline"
              class="border rounded px-2 py-1"
              required
            />
            <div class="flex gap-2 justify-end mt-2">
              <button
                type="submit"
                class="bg-blue-500 text-white px-4 py-1 rounded hover:bg-blue-700"
              >
                Save
              </button>
              <button
                type="button"
                id="closeModalBtn"
                class="bg-blue-300 text-white px-4 py-1 rounded hover:bg-blue-500"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
